name: Publish Homo Provincialis to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'homoprovincialis-site/**'
      - 'scripts/generate_readable_essays.py'
      - 'scripts/generate_love_essay_docx.py'
      - 'scripts/generate_new_essay_docx.py'
      - 'scripts/sync_essay_articles.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Convert Word essays to HTML
        run: |
          python -m pip install --disable-pip-version-check mammoth==1.9.1
          python scripts/generate_readable_essays.py

      - name: Generate Word downloads for translated essays
        run: |
          python -m pip install --disable-pip-version-check python-docx==1.2.0
          python scripts/generate_love_essay_docx.py

      - name: Generate Word downloads for new essays
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4==4.14.3
          python scripts/generate_new_essay_docx.py

      - name: Synchronize all article formats and download links
        run: python scripts/sync_essay_articles.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./homoprovincialis-site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
