name: Save essay HTML and Word files to branch

on:
  push:
    branches-ignore:
      - main
      - gh-pages
    paths:
      - 'homoprovincialis-site/Articles/**'
      - 'homoprovincialis-site/essays-by-ramon-eyquem.html'
      - 'scripts/sync_essay_articles.py'
      - '.github/workflows/save-essay-files.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: essay-files-${{ github.ref }}
  cancel-in-progress: false

jobs:
  save-essay-files:
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install article converters
        run: python -m pip install --disable-pip-version-check mammoth==1.9.1 python-docx==1.2.0 beautifulsoup4==4.14.3

      - name: Generate missing HTML/DOCX and update essay lists
        run: python scripts/sync_essay_articles.py

      - name: Validate changes
        run: git diff --check

      - name: Save generated files in the SAME branch (never main)
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git add -A homoprovincialis-site/Articles/ homoprovincialis-site/essays-by-ramon-eyquem.html
          if git diff --cached --quiet; then
            echo "All formats are already in the repository."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Store generated essay HTML and Word files in Articles"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
