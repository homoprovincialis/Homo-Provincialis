name: Keep OOL backups current after Merge

on:
  push:
    branches: [main]
    paths:
      - 'homoprovincialis-site/data/open-online-library.json'
      - 'scripts/sync_ool_backups.py'
      - '.github/workflows/ool-backup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ool-backups-main
  cancel-in-progress: false

jobs:
  update-backups:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Copy verified live catalogue to both backup files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            python3 scripts/sync_ool_backups.py
            git diff --check
            git add -- homoprovincialis-site/data/open-online-library-backup.json homoprovincialis-site/documents/open-online-library-backup.json
            if git diff --cached --quiet; then
              echo "Backup files are already current."
              exit 0
            fi
            git commit -m "chore(ool): refresh backups after approved catalogue merge [skip ci]"
            if git push origin HEAD:main; then
              echo "Backups saved. Live catalogue was not modified."
              exit 0
            fi
            echo "Main changed during synchronization; retrying ($attempt/3)."
          done
          echo "::error::Could not sync OOL backups on main."
          exit 1
